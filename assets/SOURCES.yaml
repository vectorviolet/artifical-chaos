# Where every file under assets/ comes from -- see README.md ("Asset sources").
# tests/test_sources.py keeps this complete, and scripts/gen_credits.py builds
# CREDITS.md's asset section from it. A pack's license text is in
# licenses/assets/<pack>.txt.
#
# source: a pack slug from `packs`, "own" (made for this game), "ai-generated"
#         (made with an AI image tool; then `note` names the tool and who made it),
#         or "unknown" (origin not yet confirmed; then `todo` says what to do).
# original: the file's path inside that pack. modified: what was changed.

packs:
  kenney-input-prompts:
    name: "Input Prompts"
    author: "Kenney"
    url: https://kenney.nl/assets/input-prompts
    license: CC0-1.0
    used_for: "keyboard and mouse prompts"
  mattwalkden-robot-warfare:
    name: "Free Robot Warfare Pack"
    author: "Matt Walkden"
    url: https://mattwalkden.itch.io/free-robot-warfare-pack
    license: CC0-1.0
    used_for: "soldiers, robots, effects, projectiles, tileset, UI"
  paratype-pt-sans-narrow:
    name: "PT Sans Narrow (font)"
    author: "ParaType"
    url: https://fonts.google.com/specimen/PT+Sans+Narrow
    license: OFL-1.1
    used_for: "fonts"

files:
  "fonts/OFL-PTSansNarrow.txt":
    source: paratype-pt-sans-narrow
    original: "ofl/ptsansnarrow/OFL.txt"
    modified: "same license text, different formatting"
  "fonts/PTSansNarrow-Bold.ttf":
    source: paratype-pt-sans-narrow
    original: "ofl/ptsansnarrow/PT_Sans-Narrow-Web-Bold.ttf"
    note: "byte-identical to google/fonts"
  "fonts/PTSansNarrow-Regular.ttf":
    source: paratype-pt-sans-narrow
    original: "ofl/ptsansnarrow/PT_Sans-Narrow-Web-Regular.ttf"
    note: "byte-identical to google/fonts"
  "images/branding/title.png":
    source: ai-generated
    note: "Google Gemini, generated by Umutcan Ekinci"
